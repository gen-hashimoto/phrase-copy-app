name: phrase-copy-local

services:
  frontend:
    build:
      context: ../frontend/
      dockerfile: Dockerfile
      # Use the Dockerfile dev stage.
      target: dev
    env_file:
      - .env.local
    environment:
      # Inside Docker, user the service name as the host.
      API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      # Mount local source code for live editing.
      - ../frontend:/app
      # Keep container-installed dependencies from being hidden by the source mount.
      - frontend_node_modules:/app/node_modules
      # Keep Next.js build/cache output inside Docker.
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ../backend/
      dockerfile: Dockerfile
      # Use the Dockerfile dev stage.
      target: dev
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    env_file:
      - .env.local
    ports:
      # Use 3307 on the host to avoid local MySQL conflicts.
      - "3307:3306"
    volumes:
      # Persist local database files.
      - mysql_local_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP

volumes:
  frontend_node_modules:
  frontend_next:
  mysql_local_data:

name: phrase-copy-prod

services:
  # Public entry point for HTTP and HTTPS.
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Store TLS certificates.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started

  frontend:
    build:
      context: ../frontend/
      dockerfile: Dockerfile
      # Use the Dockerfile prod stage.
      target: prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # Next.js server calls FastAPI inside Docker.
      API_BASE_URL: http://backend:8000
    expose:
      # Only expose this port to other containers.
      - "3000"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ../backend/
      dockerfile: Dockerfile
      # Use the Dockerfile prod stage.
      target: prod
    restart: unless-stopped
    env_file:
      - .env.prod
    expose:
      # Only expose this port to other containers.
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      # Persist production database files.
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  caddy_data:
  caddy_config:
  mysql_prod_data:

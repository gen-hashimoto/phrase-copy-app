# compose ファイルは infra/ にあるため、env_file の ../ は infra/ からの相対パスです。
# 実行はサンプルルート（sandbox/cursor-generated）で:
#   docker compose -f infra/docker-compose.yml up --build
services:
  db:
    image: mysql:8
    restart: unless-stopped
    # ${} 補間に依存せず、コンテナへ直接注入（プロジェクトディレクトリが infra/ でも動く）
    env_file:
      - ../.env
    ports:
      # ホストの 3306 とぶつかりやすいため 3307 に固定（変更可）
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 25s

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
